<!-- Select -->
<div class="flex flex-col justify-center gap-1">
	<!-- Select Trigger -->
	<button
		type="button"
		role="combobox"
		class="bg-surface placeholder:text-muted-text focus:border-ring focus:ring-ring flex h-10 w-44 items-center justify-between rounded-md border px-4 text-sm focus:outline-none focus:ring-1">
		<span class="line-clamp-1">Select Fruits</span>
		<svg
			stroke="currentColor"
			fill="none"
			viewBox="0 0 24 24"
			height="1em"
			width="1em"
			xmlns="http://www.w3.org/2000/svg"
			stroke-width="2"
			stroke-linecap="round"
			stroke-linejoin="round">
			<path d="m7 15 5 5 5-5" />
			<path d="m7 9 5-5 5 5" />
		</svg>
	</button>

	<!-- Select Content -->
	<div class="bg-surface text-main-text w-44 rounded-lg border p-1 text-sm">
		<!-- Select Item -->
		<button
			aria-current="true"
			type="button"
			class="bg-primary/20 text-primary inline-flex w-full cursor-pointer items-center justify-between gap-2 rounded-md px-4 py-2 text-left text-sm">
			Apple
			<svg
				stroke="currentColor"
				fill="none"
				stroke-width="2"
				viewBox="0 0 24 24"
				stroke-linecap="round"
				stroke-linejoin="round"
				height="1em"
				width="1em"
				xmlns="http://www.w3.org/2000/svg">
				<polyline points="20 6 9 17 4 12" />
			</svg>
		</button>

		<!-- Select Item -->
		<button
			type="button"
			class="hover:bg-accent hover:text-accent-text w-full cursor-pointer rounded-md px-4 py-2 text-left text-sm">
			Berry
		</button>

		<!-- Select Item -->
		<button
			type="button"
			class="hover:bg-accent hover:text-accent-text w-full cursor-pointer rounded-md px-4 py-2 text-left text-sm">
			Orange
		</button>

		<!-- Select Item/Disabled -->
		<button
			type="button"
			disabled="true"
			class="bg-surface hover:bg-accent hover:text-accent-text pointer-events-none w-full cursor-default rounded-md px-4 py-2 text-left text-sm opacity-50">
			Melon
		</button>
	</div>
</div>
