<div class="w-80 space-y-1">
	<div
		class="text-main-text flex items-center justify-between text-sm font-medium">
		<h5>Progress Label</h5>
		<p>75%</p>
	</div>
	<div class="bg-muted relative h-2 w-full overflow-hidden rounded-full">
		<div
			class="bg-primary h-full"
			aria-valuemin="0"
			aria-valuemax="100"
			aria-valuenow="75"
			role="progressbar"
			style="transform: scaleX(0.75); transform-origin: left center"></div>
	</div>
	<div class="text-muted-text flex items-center justify-between text-xs">
		<p>min</p>
		<p>max</p>
	</div>
</div>
